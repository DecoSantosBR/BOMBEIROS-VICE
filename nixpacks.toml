[phases.setup]
nixPkgs = ['nodejs-22_x', 'pnpm']
aptPkgs = [
  "ca-certificates",
  "fonts-liberation",
  "libasound2",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libcups2",
  "libdbus-1-3",
  "libgbm1",
  "libglib2.0-0",
  "libgtk-3-0",
  "libnspr4",
  "libnss3",
  "libx11-6",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2"
]

[phases.install]
cmds = ['pnpm install --no-frozen-lockfile']

[phases.build]
cmds = ['pnpm run build']

[start]
cmd = 'node dist/index.js'
